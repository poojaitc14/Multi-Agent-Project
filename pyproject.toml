[project]
name = "fraud-triage"
version = "0.1.0"
description = "E-commerce returns/refund fraud-triage multi-agent system"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "openai>=1.99.0,<3.0.0",
    "opensearch-py>=3.2.0",
    "requests-aws4auth>=1.3.2",
    "shap>=0.51.0",
    "easyocr>=1.7",
    "opencv-python-headless>=4.10,<5",
    "crewai[azure-ai-inference,litellm]>=1.15.17",
    "crewai-tools[mcp]>=1.15.17",
    "mcp>=1.28.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "streamlit>=1.62.0",
    "langfuse>=2.59.7,<3.0",
    "python-multipart>=0.0.32",
    "ragas>=0.4.3",
    "langchain-community<0.4",
    "sentence-transformers>=6.0.1",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pillow>=10.0",
]
ml = [
    "pandas<3",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "scikit-learn>=1.9.0",
    "joblib>=1.3",
    "xgboost>=3.2.0",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
    "mlflow>=2.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
# Without this, a plain `uv sync`/`uv run` only installs the "dev" group,
# silently uninstalling everything in "ml" (mlflow, scikit-learn, xgboost,
# etc.) if it happened to be present -- and mcp-servers/orchestrator_server.py
# imports ml/fraud_attribution.py at module level, so that breaks the whole
# MCP server and test suite, not just ML-specific work.
default-groups = ["dev", "ml"]
