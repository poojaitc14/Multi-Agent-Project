version: 0.2
# CodeBuild buildspec for the mcp-server service (mcp-servers/orchestrator_server.py).
# Build context is the repo root, not mcp-servers/ -- this service imports
# agents/, ml/, etc., matching infra/docker-compose.yml's own "context: .."
# for every one of the 4 services (see that file's comment for why).
# CodeBuild project setup: point "Buildspec name" at this file's path,
# buildspecs/mcp-server-buildspec.yml, and set AWS_ACCOUNT_ID as a plaintext
# environment variable on the project (not injected automatically the way
# AWS_REGION/AWS_DEFAULT_REGION are).

env:
  variables:
    AWS_REGION: eu-west-2
    ECR_REPO: fraud-triage-mcp-server-pooja
    DOCKERFILE: mcp-servers/Dockerfile
    CONTAINER_NAME: mcp-server
    IMAGE_TAG: latest

phases:
  pre_build:
    commands:
      - echo "Logging into ECR..."
      - aws ecr get-login-password --region $AWS_REGION |
        docker login --username AWS --password-stdin
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

  build:
    commands:
      - echo "Building $ECR_REPO from $DOCKERFILE..."
      - docker build -t $ECR_REPO -f $DOCKERFILE .
      - docker tag $ECR_REPO:$IMAGE_TAG
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG

  post_build:
    commands:
      - echo "Pushing $ECR_REPO:$IMAGE_TAG..."
      - docker push
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG
      - printf '{"ImageURI":"%s"}'
        "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG"
        > imageDetail.json
      - cat imageDetail.json
      - cp mcp-servers/taskdef.json .
      - cp mcp-servers/appspec.yaml .

# imageDetail.json is generated above, at build time -- {"ImageURI": "..."},
# the schema CodePipeline's "Dynamically update task definition image"
# feature reads (Image1ArtifactName/Image1ContainerName), not the
# imagedefinitions.json shape ECS-native blue/green expects.
# appspec.yaml / taskdef.json are static templates checked into
# mcp-servers/ -- copied into the build output here so the CodeDeploy-backed
# deploy action (which only takes BuildArtifact as input on this pipeline,
# not SourceArtifact) can find them.
artifacts:
  files:
    - imageDetail.json
    - appspec.yaml
    - taskdef.json
