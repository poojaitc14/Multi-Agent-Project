version: 0.2
# CodeBuild buildspec for the chat service (chat/app.py, Streamlit
# customer-facing frontend). Build context is the repo root, not chat/ --
# matches infra/docker-compose.yml's own "context: .." for every one of the
# 4 services (see that file's comment for why). CodeBuild project setup:
# point "Buildspec name" at this file's path, buildspecs/chat-buildspec.yml,
# and set AWS_ACCOUNT_ID as a plaintext environment variable on the project
# (not injected automatically the way AWS_REGION/AWS_DEFAULT_REGION are).

env:
  variables:
    AWS_REGION: eu-west-2
    ECR_REPO: fraud-triage-chat-pooja
    DOCKERFILE: chat/Dockerfile
    CONTAINER_NAME: chat
    IMAGE_TAG: latest

phases:
  pre_build:
    commands:
      - echo "Logging into ECR..."
      - aws ecr get-login-password --region $AWS_REGION |
        docker login --username AWS --password-stdin
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

  build:
    commands:
      - echo "Building $ECR_REPO from $DOCKERFILE..."
      - docker build -t $ECR_REPO -f $DOCKERFILE .
      - docker tag $ECR_REPO:$IMAGE_TAG
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG

  post_build:
    commands:
      - echo "Pushing $ECR_REPO:$IMAGE_TAG..."
      - docker push
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME"
        "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG"
        > imagedefinitions.json
      - cat imagedefinitions.json

# imagedefinitions.json is generated above, at build time.
# appspec.yaml / taskdef.json are NOT generated by this build -- they still
# need to be created as real, checked-in files (this project's console
# runbook artifact, "Fraud Triage to ECS Pipeline", shows their expected
# shape) before CodePipeline's ECS Blue/Green deploy action can consume
# this build's artifacts. Real, honest gap -- not fabricated here.
artifacts:
  files:
    - imagedefinitions.json
    - appspec.yaml
    - taskdef.json
