name: Test

# testing-and-evaluation-plan.md's "CI gate policy". Real history, not a
# design written once and left alone:
# - Q85 folded tests/eval/ into this same per-push gate once every agent
#   moved off local Ollama (Q52/Q75).
# - Q91/Q93 found and fixed a real cost: the two 25-scenario golden sets
#   ran dozens of real LLM/vision calls each -- dropped tests/eval/ back
#   out of the push gate, closer to Q12's original nightly-only split.
# - Q95 then found, via real heartbeat instrumentation (not guessing),
#   that the OOM theory behind that was actually wrong -- the MCP server
#   process stayed alive and at flat memory the whole time a run failed.
#   The real cause: crewai.LLM and the boto3 clients had no explicit
#   timeout, so a single hung real request could block a single-worker
#   server's every subsequent request forever. Fixed with explicit,
#   bounded timeouts.
# - Q96 (user decision): even with those fixes, `tests/` still depends on
#   a real, live MCP server + real AWS/Azure for most of its files
#   (test_backend.py, test_observability.py, test_orchestrator_server.py,
#   parts of test_security_and_pii.py) -- conftest.py's fixtures that
#   start that server are session-scoped autouse=True, firing for ANY
#   test collected from tests/, so even a single unrelated test file
#   pays that cost and that risk. Rather than refactor conftest.py to
#   make the live server opt-in (a real, larger change, deferred), this
#   gate now runs only tests/test_agents_feature_cols_sync.py on push --
#   the one file that's a genuine unit test (pure constant comparison, no
#   real external I/O). Every other test file still exists and still
#   passes locally/in a real container; it's just not part of this
#   specific push gate anymore. A real, honest scope narrowing, not
#   silently dropped test coverage.
#
# Real, not mocked, matching this project's tests themselves: a real
# Postgres service container, real AWS DynamoDB/S3 (dev-prefixed
# resources per project-plan.md Q51 -- LocalStack was dropped project-
# wide, CI is no exception), and real Azure OpenAI/Langfuse calls via
# repository secrets. This still means CI costs real API spend on every
# push (tests/ alone makes genuine LLM calls too, just far fewer) -- an
# accepted, explicit tradeoff, not an oversight.
#
# RAGAS/cost reports (tests/eval/ragas_report.py, cost_report.py) were
# already, separately, never part of this gate -- testing-and-evaluation-
# plan.md's Q19 is explicit that cost tracking is purely informational,
# no automated gate/ceiling, and RAGAS's thresholds are still uncalibrated
# (Q18/Q22) with no pass/fail criteria decided yet to gate on.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fraud_triage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fraud_triage
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # project-plan.md Q91: the repo's AWS credentials are temporary STS
      # ones (ASIA-prefixed access key) -- these require a session token to
      # authenticate at all, confirmed for real (UnrecognizedClientException
      # without one). Accepted, explicit tradeoff over long-lived IAM
      # credentials: this secret needs re-pasting whenever the underlying
      # session expires (hours), not a one-time setup.
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      CONVERSATION_STATE_TABLE: conversation-state-ci
      CLAIM_PHOTOS_BUCKET: claim-photos-ci
      TRANSCRIPTS_BUCKET: chat-transcripts-ci
      CLAIM_FREQUENCY_TABLE: claim-frequency-ci
      MCP_SERVER_HOST: 127.0.0.1
      MCP_SERVER_PORT: 8001
      ORCHESTRATOR_MCP_TOKEN: ${{ secrets.ORCHESTRATOR_MCP_TOKEN }}
      IMAGE_PARSING_MCP_TOKEN: ${{ secrets.IMAGE_PARSING_MCP_TOKEN }}
      FRAUD_SCORING_MCP_TOKEN: ${{ secrets.FRAUD_SCORING_MCP_TOKEN }}
      DECISION_MCP_TOKEN: ${{ secrets.DECISION_MCP_TOKEN }}
      REVIEWER_PASSWORD: ${{ secrets.REVIEWER_PASSWORD }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME }}
      AZURE_OPENAI_EMBEDDING_MODEL: ${{ secrets.AZURE_OPENAI_EMBEDDING_MODEL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      # docker-compose.yml's postgres service mounts infra/init.sql into
      # /docker-entrypoint-initdb.d/, which the official Postgres image
      # auto-runs on first startup -- but GitHub Actions' `services:`
      # containers start before actions/checkout even runs, so that same
      # repo-relative volume mount isn't possible here (confirmed for
      # real: without this step, every tool call hit a genuine
      # psycopg.errors.UndefinedTable, not a connectivity problem). Run
      # the same real schema script explicitly instead, once the service
      # is already up and the repo is checked out.
      - name: Initialize Postgres schema
        # Still needed even for one unit test file: conftest.py's fixtures
        # are session-scoped autouse=True (fire for any test collected
        # from tests/, regardless of that test's own needs) and its
        # _local_infra fixture calls the real ensure_local_infra(), which
        # genuinely touches Postgres (customer_profiles), not just AWS.
        run: psql "$DATABASE_URL" -f infra/init.sql

      # project-plan.md Q96: the standalone MCP server process (nohup'd on
      # port 8001) this step used to start here is real, confirmed dead
      # weight for this test file specifically -- conftest.py's own
      # _http_server fixture starts its OWN in-process server (a thread,
      # port 8091) using the same already-imported srv.mcp object, and
      # test_agents_feature_cols_sync.py never calls any MCP tool at all.
      # Removed along with its heartbeat/log-on-failure steps (Q95's real
      # instrumentation, no longer needed once the thing it was watching
      # was removed) rather than left running unused.
      - name: Run tests (unit)
        # Only the one genuine unit test file (project-plan.md Q96) --
        # every other file in tests/ (and all of tests/eval/, per Q93)
        # needs the real MCP server/AWS/Azure and isn't part of this push
        # gate right now; still real and runnable locally/in a container.
        run: uv run pytest tests/test_agents_feature_cols_sync.py -v
