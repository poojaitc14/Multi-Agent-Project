name: Test

# testing-and-evaluation-plan.md's "CI gate policy". Q85 folded tests/eval/
# (the golden-set/property/guardrail eval harness) into this same per-push
# gate once every agent moved off local Ollama models (Q52/Q75) -- but a
# real, live-debugged run (project-plan.md Q91) proved that decision had a
# genuine cost neither Q85 nor Q12 anticipated: the two 25-scenario golden
# sets alone run dozens of real LLM/vision calls each, and the hosted
# runner's MCP server was very likely OOM-killed partway through (silent
# death in the server log, no traceback -- 101 real tests had already
# passed by then). Q93 (user decision) reverses Q85's "fold everything in"
# back toward Q12's original split: tests/eval/ no longer runs on push,
# closer to a nightly/pre-deploy cadence -- run it manually/locally
# (`uv run pytest tests/eval/ -v`) until an actual scheduled trigger is
# set up. tests/ (unit/integration/security/PII-isolation, per Q7) still
# runs and blocks on every push/PR -- it never needed the heavy eval
# harness's real-model loops to do its job.
#
# Real, not mocked, matching this project's tests themselves: a real
# Postgres service container, real AWS DynamoDB/S3 (dev-prefixed
# resources per project-plan.md Q51 -- LocalStack was dropped project-
# wide, CI is no exception), and real Azure OpenAI/Langfuse calls via
# repository secrets. This still means CI costs real API spend on every
# push (tests/ alone makes genuine LLM calls too, just far fewer) -- an
# accepted, explicit tradeoff, not an oversight.
#
# RAGAS/cost reports (tests/eval/ragas_report.py, cost_report.py) were
# already, separately, never part of this gate -- testing-and-evaluation-
# plan.md's Q19 is explicit that cost tracking is purely informational,
# no automated gate/ceiling, and RAGAS's thresholds are still uncalibrated
# (Q18/Q22) with no pass/fail criteria decided yet to gate on.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fraud_triage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fraud_triage
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # project-plan.md Q91: the repo's AWS credentials are temporary STS
      # ones (ASIA-prefixed access key) -- these require a session token to
      # authenticate at all, confirmed for real (UnrecognizedClientException
      # without one). Accepted, explicit tradeoff over long-lived IAM
      # credentials: this secret needs re-pasting whenever the underlying
      # session expires (hours), not a one-time setup.
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      CONVERSATION_STATE_TABLE: conversation-state-ci
      CLAIM_PHOTOS_BUCKET: claim-photos-ci
      TRANSCRIPTS_BUCKET: chat-transcripts-ci
      CLAIM_FREQUENCY_TABLE: claim-frequency-ci
      MCP_SERVER_HOST: 127.0.0.1
      MCP_SERVER_PORT: 8001
      ORCHESTRATOR_MCP_TOKEN: ${{ secrets.ORCHESTRATOR_MCP_TOKEN }}
      IMAGE_PARSING_MCP_TOKEN: ${{ secrets.IMAGE_PARSING_MCP_TOKEN }}
      FRAUD_SCORING_MCP_TOKEN: ${{ secrets.FRAUD_SCORING_MCP_TOKEN }}
      DECISION_MCP_TOKEN: ${{ secrets.DECISION_MCP_TOKEN }}
      REVIEWER_PASSWORD: ${{ secrets.REVIEWER_PASSWORD }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME }}
      AZURE_OPENAI_EMBEDDING_MODEL: ${{ secrets.AZURE_OPENAI_EMBEDDING_MODEL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      # docker-compose.yml's postgres service mounts infra/init.sql into
      # /docker-entrypoint-initdb.d/, which the official Postgres image
      # auto-runs on first startup -- but GitHub Actions' `services:`
      # containers start before actions/checkout even runs, so that same
      # repo-relative volume mount isn't possible here (confirmed for
      # real: without this step, every tool call hit a genuine
      # psycopg.errors.UndefinedTable, not a connectivity problem). Run
      # the same real schema script explicitly instead, once the service
      # is already up and the repo is checked out.
      - name: Initialize Postgres schema
        run: psql "$DATABASE_URL" -f infra/init.sql

      # The real MCP server, backed by real Postgres/AWS/Azure -- every
      # test in tests/ and tests/eval/ requires it already running,
      # exactly like local dev (agents/mcp_tools.py's own docstring: "no
      # in-process fallback, by design").
      - name: Start MCP server
        run: |
          nohup uv run python mcp-servers/orchestrator_server.py > mcp-server.log 2>&1 &
          echo $! > mcp-server.pid
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8001/mcp 2>/dev/null | grep -q "406"; then
              echo "MCP server up"
              exit 0
            fi
            sleep 5
          done
          echo "MCP server did not become ready in time"
          cat mcp-server.log
          exit 1

      # project-plan.md Q94: a real, confirmed connection failure on the
      # very first test that actually needs real HTTP to the MCP server --
      # this project's own investigation walked back an earlier OOM theory
      # once it found most "passed" tests before the failure never touch
      # the server over real HTTP at all. This heartbeat (PID liveness +
      # RSS memory, every 5s, appended throughout the whole test run, not
      # just on failure) is real instrumentation to find out what actually
      # happens to the process, not another guess.
      - name: Start MCP server heartbeat monitor
        run: |
          MCP_PID=$(cat mcp-server.pid)
          nohup bash -c '
            while true; do
              if kill -0 '"$MCP_PID"' 2>/dev/null; then
                rss=$(ps -o rss= -p '"$MCP_PID"' 2>/dev/null | tr -d " ")
                echo "$(date -u +%H:%M:%S) alive=yes rss_kb=${rss:-unknown}"
              else
                echo "$(date -u +%H:%M:%S) alive=no -- process is gone"
              fi
              sleep 5
            done
          ' > mcp-server-heartbeat.log 2>&1 &

      - name: Run tests (unit/integration/security/PII-isolation)
        # tests/eval/ deliberately excluded (project-plan.md Q93) -- see
        # this file's header comment for why.
        run: uv run pytest tests/ --ignore=tests/eval -v

      - name: Show MCP server heartbeat (always -- confirms liveness even on a pass)
        if: always()
        run: cat mcp-server-heartbeat.log

      - name: Show MCP server log on failure
        if: failure()
        run: cat mcp-server.log
